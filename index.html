<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><title>NexNav — GPS диагностика</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0}body{font:15px -apple-system,system-ui,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:env(safe-area-inset-top,12px);left:12px;right:12px;background:#101820ee;color:white;padding:12px;border-radius:14px;box-shadow:0 3px 15px #0005}.panel small{color:#bcc7d0}.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.actions button{min-width:38%}button{border:0;border-radius:9px;background:#3478f6;color:white;padding:10px;font-weight:600;flex:1}.status{font-weight:700}#route{background:#25374a}.bottom{position:absolute;z-index:1000;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:12px;right:12px;background:#101820ee;color:#fff;border-radius:12px;padding:10px;font-size:13px}</style></head><body><div id="map"></div><section class="panel"><strong>NexNav</strong> <small>прототип 0.4 • диагностика GPS</small><div id="status" class="status">Ожидание геолокации</div><div id="metrics">—</div><div class="actions"><button id="locate">Моё положение</button><button id="route">Маршрут к точке</button><button id="manual">Указать положение</button><button id="journal">Журнал GPS</button></div></section><div class="bottom" id="hint">Нажми на карту для выбора цели. Карта требует интернет; офлайн-карты и маршруты — следующий этап. Не используй прототип как основной навигатор.</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',center:[30.3141,59.9386],zoom:11,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');map.on('load',()=>{map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#3478f6','fill-opacity':0.1}});map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#3478f6','line-width':6}});});function circlePolygon(lon,lat,r){const n=48,coords=[];for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;coords.push([lon+(r*Math.cos(a))/(111320*Math.max(.01,Math.cos(lat*Math.PI/180))),lat+(r*Math.sin(a))/111320]);}return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{}};}function updateAccuracy(c){const src=map.getSource('accuracy');if(src)src.setData({type:'FeatureCollection',features:[circlePolygon(c.longitude,c.latitude,c.accuracy)]});}
let last=null,marker=null,accuracy=null,target=null,route=null,watch=null,points=[],manualMode=false,manualAnchor=null,pending=null,staleCount=0,anomalies=0,lastTrustedAt=0,history=[],recovery=null;const status=document.getElementById('status'),metrics=document.getElementById('metrics'),hint=document.getElementById('hint');
function logEvent(type,c,detail){history.unshift({time:new Date().toLocaleTimeString('ru-RU'),type,lat:c?.latitude,lon:c?.longitude,detail});history=history.slice(0,60);}const rad=x=>x*Math.PI/180;function meters(a,b){const dLat=rad(b.latitude-a.latitude),dLon=rad(b.longitude-a.longitude),h=Math.sin(dLat/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(dLon/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(h)));}
function display(c,center=false){const pos=[c.longitude,c.latitude];if(!marker){const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border:3px solid white;border-radius:50%;background:#3478f6;box-shadow:0 1px 6px #0006';marker=new maplibregl.Marker({element:el}).setLngLat(pos).addTo(map);center=true;}else marker.setLngLat(pos);if(center)map.easeTo({center:pos,zoom:16});updateAccuracy(c);}
function onPosition(p){
const c=p.coords,t=p.timestamp;if(!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude)||!Number.isFinite(c.accuracy))return;
const anchor=last?.c||manualAnchor,dist=anchor?meters(anchor,c):0,dt=last?(t-last.t)/1000:0;
let reason='';
if(last&&dt<=0)reason='устаревшее измерение';
else if(c.accuracy>1000)reason='низкая точность';
else if(anchor&&dist>Math.max(250,Math.min(1500,c.accuracy*2))&&(!last||dist/Math.max(1,dt)>65))reason='резкий скачок';
if(pending){
const same=meters(pending.c,c)<80;
if(same){pending.count++;pending.last=t;}else if(reason){pending={c,t,last:t,count:1};}
if(same&&pending.count>=3&&pending.last-pending.t>=8000)reason='устойчивая подозрительная точка';
}
if(reason){
anomalies++;if(!pending||meters(pending.c,c)>=80)pending={c,t,last:t,count:1};
recovery=null;logEvent('Отклонено',c,reason+'; от опоры '+Math.round(dist)+' м');
status.textContent='⚠ Возможная подмена: '+reason;
metrics.textContent='Отклонено: '+anomalies+' · Подозрительная точка: '+pending.count+' изм. / '+Math.round((pending.last-pending.t)/1000)+' с · От опоры: '+Math.round(dist)+' м';
hint.textContent='Маркер показывает последнюю принятую или ручную точку, НЕ подтверждённое текущее положение.';
return;
}
if(pending){
const nearAnchor=anchor&&dist<=Math.max(100,Math.min(250,c.accuracy*2));
if(!nearAnchor){anomalies++;logEvent('Отклонено',c,'не подтверждено возвращение к опорной точке');status.textContent='⚠ GPS не подтверждён: координаты вне опорной области';return;}
if(!recovery||meters(recovery.c,c)>75||t-recovery.last>15000){recovery={c,count:1,first:t,last:t};}
else{recovery.count++;recovery.last=t;}
if(recovery.count<3||t-recovery.first<4000){status.textContent='Проверка восстановления GPS: '+recovery.count+'/3';metrics.textContent='Ожидание нескольких согласованных измерений рядом с опорной точкой';return;}
pending=null;recovery=null;logEvent('Восстановление',c,'3 согласованных измерения рядом с опорной точкой');
}
last={c,t};manualAnchor=null;lastTrustedAt=Date.now();points.push([c.latitude,c.longitude]);if(points.length>3000)points.shift();display(c);
status.textContent=c.accuracy<=25?'GPS: принято, достоверность не гарантирована':c.accuracy<=100?'GPS: приблизительно':'GPS: низкая точность';
metrics.textContent='Точность ОС: ±'+Math.round(c.accuracy)+' м · Скорость: '+(c.speed==null?'—':Math.round(c.speed*3.6)+' км/ч')+' · Отклонено: '+anomalies;
}
function start(){if(!navigator.geolocation){status.textContent='Геолокация недоступна';return;}if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(onPosition,e=>{status.textContent='Нет геопозиции: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});}document.getElementById('locate').onclick=()=>{if(last||manualAnchor){const c=last?.c||manualAnchor;map.easeTo({center:[c.longitude,c.latitude],zoom:16});}else start();};document.getElementById('journal').onclick=()=>{const rows=history.slice(0,20).map(x=>x.time+' — '+x.type+': '+x.detail+' ('+(x.lat?.toFixed(5)??'—')+', '+(x.lon?.toFixed(5)??'—')+')');alert(rows.length?rows.join('\\n'):'Журнал пуст');};document.getElementById('manual').onclick=()=>{manualMode=true;hint.textContent='Нажми на карте в месте, где ты действительно находишься. Эта точка будет ручной опорой, не GPS-измерением.';};map.on('click',e=>{if(manualMode){manualMode=false;const c={latitude:e.lngLat.lat,longitude:e.lngLat.lng,accuracy:50,speed:null,heading:null};manualAnchor=c;last=null;pending=null;recovery=null;staleCount=0;logEvent('Ручная точка',c,'указана пользователем');display(c,true);status.textContent='Ручная точка — GPS не подтверждён';metrics.textContent='Положение указано вручную';hint.textContent='Ручная точка сохранена на время сеанса. GPS будет проверяться относительно неё; при движении без GPS позиция не обновляется.';return;}if(target)target.remove();target=new maplibregl.Marker({color:'#f97316'}).setLngLat(e.lngLat).addTo(map);hint.textContent='Цель выбрана. Нажми «Маршрут к точке». Для маршрута требуется интернет.';});
document.getElementById('route').onclick=async()=>{if(!(last||manualAnchor)||!target){hint.textContent='Сначала дождись координат и выбери цель нажатием на карту.';return;}const a=last?.c||manualAnchor,b=target.getLngLat();hint.textContent='Строим маршрут…';try{const url='https://router.project-osrm.org/route/v1/driving/'+a.longitude+','+a.latitude+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson';const res=await fetch(url);if(!res.ok)throw Error('Сервис маршрутов недоступен');const data=await res.json();if(!data.routes?.length)throw Error('Маршрут не найден');route=data.routes[0].geometry;const src=map.getSource('route');if(src)src.setData({type:'Feature',geometry:route,properties:{}});const bounds=new maplibregl.LngLatBounds();route.coordinates.forEach(p=>bounds.extend(p));map.fitBounds(bounds,{padding:50});hint.textContent='Маршрут: '+(data.routes[0].distance/1000).toFixed(1)+' км. Это тестовый онлайн-маршрут, без учёта пробок.';}catch(e){hint.textContent='Ошибка: '+e.message;}};start();
</script></body></html>
