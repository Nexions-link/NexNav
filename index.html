<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><title>NexNav — GPS диагностика</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0}body{font:15px -apple-system,system-ui,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:env(safe-area-inset-top,12px);left:12px;right:12px;background:#101820ee;color:white;padding:12px;border-radius:14px;box-shadow:0 3px 15px #0005}.panel small{color:#bcc7d0}.actions{display:flex;gap:8px;margin-top:8px}button{border:0;border-radius:9px;background:#3478f6;color:white;padding:10px;font-weight:600;flex:1}.status{font-weight:700}#route{background:#25374a}.bottom{position:absolute;z-index:1000;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:12px;right:12px;background:#101820ee;color:#fff;border-radius:12px;padding:10px;font-size:13px}</style></head><body><div id="map"></div><section class="panel"><strong>NexNav</strong> <small>прототип 0.2 • диагностика GPS</small><div id="status" class="status">Ожидание геолокации</div><div id="metrics">—</div><div class="actions"><button id="locate">Моё положение</button><button id="route">Маршрут к точке</button></div></section><div class="bottom" id="hint">Нажми на карту для выбора цели. Карта требует интернет; офлайн-карты и маршруты — следующий этап. Не используй прототип как основной навигатор.</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',center:[30.3141,59.9386],zoom:11,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');map.on('load',()=>{map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#3478f6','fill-opacity':0.1}});map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#3478f6','line-width':6}});});function circlePolygon(lon,lat,r){const n=48,coords=[];for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;coords.push([lon+(r*Math.cos(a))/(111320*Math.max(.01,Math.cos(lat*Math.PI/180))),lat+(r*Math.sin(a))/111320]);}return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{}};}function updateAccuracy(c){const src=map.getSource('accuracy');if(src)src.setData({type:'FeatureCollection',features:[circlePolygon(c.longitude,c.latitude,c.accuracy)]});}
let last=null,marker=null,accuracy=null,target=null,route=null,watch=null,points=[];const status=document.getElementById('status'),metrics=document.getElementById('metrics'),hint=document.getElementById('hint');
const rad=x=>x*Math.PI/180;function meters(a,b){const dLat=rad(b.latitude-a.latitude),dLon=rad(b.longitude-a.longitude),h=Math.sin(dLat/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(dLon/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(h)));}
function onPosition(p){const c=p.coords,t=p.timestamp;let accepted=true,reason='';if(last){const dt=(t-last.t)/1000,d=meters(last.c,c);if(dt<=0){accepted=false;reason='устаревшая точка';}else if(d/dt>70 && d>Math.max(100,c.accuracy*2,last.c.accuracy*2)){accepted=false;reason='аномальный скачок';}}if(!accepted){status.textContent='⚠ Подозрительная координата: '+reason;return;}last={c,t};points.push([c.latitude,c.longitude]);if(points.length>3000)points.shift();const latlng=[c.longitude,c.latitude];if(!marker){const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border:3px solid white;border-radius:50%;background:#3478f6;box-shadow:0 1px 6px #0006';marker=new maplibregl.Marker({element:el}).setLngLat(latlng).addTo(map);map.jumpTo({center:latlng,zoom:16});}else marker.setLngLat(latlng);updateAccuracy(c);status.textContent=c.accuracy<=25?'Позиция: предварительно точная':c.accuracy<=100?'Позиция: приблизительная':'Позиция: низкая точность';metrics.textContent='Точность ОС: ±'+Math.round(c.accuracy)+' м · Скорость: '+(c.speed==null?'—':Math.round(c.speed*3.6)+' км/ч')+' · Курс: '+(c.heading==null?'—':Math.round(c.heading)+'°');}
function start(){if(!navigator.geolocation){status.textContent='Геолокация недоступна';return;}if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(onPosition,e=>{status.textContent='Нет геопозиции: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});}document.getElementById('locate').onclick=()=>{if(last)map.easeTo({center:[last.c.longitude,last.c.latitude],zoom:16});else start();};map.on('click',e=>{if(target)target.remove();target=new maplibregl.Marker({color:'#f97316'}).setLngLat(e.lngLat).addTo(map);hint.textContent='Цель выбрана. Нажми «Маршрут к точке». Для маршрута требуется интернет.';});
document.getElementById('route').onclick=async()=>{if(!last||!target){hint.textContent='Сначала дождись координат и выбери цель нажатием на карту.';return;}const a=last.c,b=target.getLngLat();hint.textContent='Строим маршрут…';try{const url='https://router.project-osrm.org/route/v1/driving/'+a.longitude+','+a.latitude+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson';const res=await fetch(url);if(!res.ok)throw Error('Сервис маршрутов недоступен');const data=await res.json();if(!data.routes?.length)throw Error('Маршрут не найден');route=data.routes[0].geometry;const src=map.getSource('route');if(src)src.setData({type:'Feature',geometry:route,properties:{}});const bounds=new maplibregl.LngLatBounds();route.coordinates.forEach(p=>bounds.extend(p));map.fitBounds(bounds,{padding:50});hint.textContent='Маршрут: '+(data.routes[0].distance/1000).toFixed(1)+' км. Это тестовый онлайн-маршрут, без учёта пробок.';}catch(e){hint.textContent='Ошибка: '+e.message;}};start();
</script></body></html>
