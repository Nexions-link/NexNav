<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><title>NexNav — GPS диагностика</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"><style>html,body,#map{height:100%;margin:0}body{font:15px -apple-system,system-ui,sans-serif}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:env(safe-area-inset-top,12px);left:12px;right:12px;background:#101820ee;color:white;padding:12px;border-radius:14px;box-shadow:0 3px 15px #0005}.panel small{color:#bcc7d0}.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.actions button{min-width:38%}button{border:0;border-radius:9px;background:#3478f6;color:white;padding:10px;font-weight:600;flex:1}.status{font-weight:700}#route{background:#25374a}.bottom{position:absolute;z-index:1000;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);left:12px;right:12px;background:#101820ee;color:#fff;border-radius:12px;padding:10px;font-size:13px}</style></head><body><div id="map"></div><section class="panel"><strong>NexNav</strong> <small>прототип 0.5.2 • диагностика GPS</small><div id="status" class="status">Ожидание геолокации</div><div id="metrics">—</div><div class="actions"><button id="locate">Моё положение</button><button id="route">Маршрут к точке</button><button id="manual">Указать положение</button><button id="journal">Журнал GPS</button></div></section><div class="bottom" id="hint">Нажми на карту для выбора цели. Карта требует интернет; офлайн-карты и маршруты — следующий этап. Не используй прототип как основной навигатор.</div><script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script><script>
const map=new maplibregl.Map({container:'map',center:[30.3141,59.9386],zoom:11,style:{version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]}});map.addControl(new maplibregl.NavigationControl({showCompass:false}),'bottom-right');map.on('load',()=>{map.addSource('accuracy',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'accuracy-fill',type:'fill',source:'accuracy',paint:{'fill-color':'#3478f6','fill-opacity':0.1}});map.addSource('route',{type:'geojson',data:{type:'FeatureCollection',features:[]}});map.addLayer({id:'route-line',type:'line',source:'route',paint:{'line-color':'#3478f6','line-width':6}});});function circlePolygon(lon,lat,r){const n=48,coords=[];for(let i=0;i<=n;i++){const a=2*Math.PI*i/n;coords.push([lon+(r*Math.cos(a))/(111320*Math.max(.01,Math.cos(lat*Math.PI/180))),lat+(r*Math.sin(a))/111320]);}return {type:'Feature',geometry:{type:'Polygon',coordinates:[coords]},properties:{}};}function updateAccuracy(c){const src=map.getSource('accuracy');if(src)src.setData({type:'FeatureCollection',features:[circlePolygon(c.longitude,c.latitude,c.accuracy)]});}
let last=null,marker=null,accuracy=null,target=null,route=null,watch=null,points=[],manualMode=false,manualAnchor=null,pending=null,staleCount=0,anomalies=0,lastTrustedAt=0,history=[],recovery=null,gpsState='unknown',lastSampleTime=0;const status=document.getElementById('status'),metrics=document.getElementById('metrics'),hint=document.getElementById('hint');
function setGPSState(next,c,detail){if(gpsState!==next){gpsState=next;logEvent('Состояние GPS',c,next+': '+detail);}}function logEvent(type,c,detail){history.unshift({time:new Date().toLocaleTimeString('ru-RU'),type,lat:c?.latitude,lon:c?.longitude,detail});history=history.slice(0,60);}const rad=x=>x*Math.PI/180;function meters(a,b){const dLat=rad(b.latitude-a.latitude),dLon=rad(b.longitude-a.longitude),h=Math.sin(dLat/2)**2+Math.cos(rad(a.latitude))*Math.cos(rad(b.latitude))*Math.sin(dLon/2)**2;return 12742000*Math.asin(Math.min(1,Math.sqrt(h)));}
function display(c,center=false){const pos=[c.longitude,c.latitude];if(!marker){const el=document.createElement('div');el.style.cssText='width:16px;height:16px;border:3px solid white;border-radius:50%;background:#3478f6;box-shadow:0 1px 6px #0006';marker=new maplibregl.Marker({element:el}).setLngLat(pos).addTo(map);center=true;}else marker.setLngLat(pos);if(center)map.easeTo({center:pos,zoom:16});updateAccuracy(c);}
function onPosition(p){
const c=p.coords,t=p.timestamp;
if(!Number.isFinite(c.latitude)||!Number.isFinite(c.longitude)||!Number.isFinite(c.accuracy)||!Number.isFinite(t))return;
if(t<=lastSampleTime){status.textContent='GPS: повторное или устаревшее измерение';return;}
lastSampleTime=t;
const anchor=last?.c||manualAnchor,dist=anchor?meters(anchor,c):null;
const dt=last?(t-last.t)/1000:null;
const limit=Math.max(250,Math.min(1500,c.accuracy*2));
let reason='';
if(c.accuracy>1000)reason='низкая точность';
else if(anchor&&dist>limit&&(!last||dt<=0||dist/Math.max(1,dt)>65))reason='резкий скачок';
else if(pending&&anchor&&dist>Math.max(250,Math.min(1500,c.accuracy*2)))reason='вдали от опорной точки';
if(reason){
anomalies++;recovery=null;
if(!pending||meters(pending.c,c)>80||t-pending.last>30000)pending={c,first:t,last:t,count:1};
else{pending.count++;pending.last=t;}
const duration=Math.max(0,Math.round((pending.last-pending.first)/1000));
const stable=pending.count>=3&&duration>=8;
setGPSState('unreliable',c,reason);
logEvent('Отклонено',c,(stable?'Устойчивая ложная точка (предположение); ':'')+reason+'; от опоры '+(dist===null?'неизвестно':Math.round(dist)+' м'));
status.textContent='⚠ GPS НЕДОСТОВЕРЕН'+(stable?' · повторяющаяся точка':'');
metrics.textContent='Отклонено: '+anomalies+' · Подозрительная точка: '+pending.count+' разных измер. / '+duration+' с · От опоры: '+(dist===null?'—':Math.round(dist)+' м');
hint.textContent='Маркер НЕ показывает подтверждённое текущее положение. Не ориентируйся по нему при вождении.';
return;
}
if(pending){
const nearAnchor=anchor&&dist<=Math.max(100,Math.min(250,c.accuracy*2));
if(!nearAnchor||c.accuracy>100){setGPSState('unreliable',c,'восстановление не подтверждено');status.textContent='⚠ GPS НЕДОСТОВЕРЕН · ожидаем возвращения';return;}
if(!recovery||meters(recovery.c,c)>75||t-recovery.last>15000)recovery={c,first:t,last:t,count:1};
else{recovery.count++;recovery.last=t;}
setGPSState('recovering',c,'проверка согласованности');
status.textContent='Проверка восстановления GPS: '+recovery.count+'/3';
metrics.textContent='Подтверждение рядом с опорой: '+Math.round(dist)+' м';
if(recovery.count<3||t-recovery.first<4000)return;
pending=null;recovery=null;logEvent('Восстановление',c,'3 разных по времени согласованных измерения рядом с опорой');
}
if(manualAnchor&&!pending){pending={c,first:t,last:t,count:1};setGPSState('unreliable',c,'ручная точка требует проверки GPS');status.textContent='Ручная точка сохранена · GPS проверяется';return;}
if(!anchor&&c.accuracy>100){setGPSState('unknown',c,'нет надёжной опоры');status.textContent='GPS: низкая точность, требуется ручная точка';return;}
last={c,t};manualAnchor=null;lastTrustedAt=Date.now();points.push([c.latitude,c.longitude]);if(points.length>3000)points.shift();display(c);
setGPSState('accepted',c,'координата принята, подлинность GPS не гарантируется');
status.textContent='GPS: принято · подлинность не гарантирована';
metrics.textContent='Точность ОС: ±'+Math.round(c.accuracy)+' м · Скорость: '+(c.speed==null?'—':Math.round(c.speed*3.6)+' км/ч')+' · Отклонено: '+anomalies;
}
function restoreManual(){try{const saved=JSON.parse(localStorage.getItem('nexnav.manual.v1')||'null');if(!saved||!Number.isFinite(saved.latitude)||!Number.isFinite(saved.longitude)||Math.abs(saved.latitude)>90||Math.abs(saved.longitude)>180)return;const c={latitude:saved.latitude,longitude:saved.longitude,accuracy:50,speed:null,heading:null};manualAnchor=c;setGPSState('manual',c,'восстановлено из памяти браузера');display(c,true);status.textContent='Сохранённая ручная точка — GPS не подтверждён';metrics.textContent='Сохранена: '+new Date(saved.savedAt).toLocaleString('ru-RU');hint.textContent='Ручная точка восстановлена из памяти браузера. Она может быть устаревшей: проверь её перед использованием.';}catch(e){}}function start(){if(!navigator.geolocation){status.textContent='Геолокация недоступна';return;}if(watch!==null)navigator.geolocation.clearWatch(watch);watch=navigator.geolocation.watchPosition(onPosition,e=>{status.textContent='Нет геопозиции: '+e.message},{enableHighAccuracy:true,maximumAge:0,timeout:20000});}document.getElementById('locate').onclick=()=>{if(last||manualAnchor){const c=last?.c||manualAnchor;map.easeTo({center:[c.longitude,c.latitude],zoom:16});}else start();};document.getElementById('journal').onclick=()=>{const rows=history.slice(0,20).map(x=>x.time+' — '+x.type+': '+x.detail+' ('+(x.lat?.toFixed(5)??'—')+', '+(x.lon?.toFixed(5)??'—')+')');alert(rows.length?rows.join('\n'):'Журнал пуст');};document.getElementById('manual').onclick=()=>{manualMode=true;hint.textContent='Нажми на карте в месте, где ты действительно находишься. Эта точка будет ручной опорой, не GPS-измерением.';};map.on('click',e=>{if(manualMode){manualMode=false;const c={latitude:e.lngLat.lat,longitude:e.lngLat.lng,accuracy:50,speed:null,heading:null};manualAnchor=c;let savedOK=false;try{const value=JSON.stringify({latitude:c.latitude,longitude:c.longitude,savedAt:Date.now()});localStorage.setItem('nexnav.manual.v1',value);savedOK=localStorage.getItem('nexnav.manual.v1')===value;}catch(e){}last=null;pending=null;recovery=null;setGPSState('manual',c,'положение указано вручную');staleCount=0;logEvent('Ручная точка',c,'указана пользователем');display(c,true);status.textContent='Ручная точка — GPS не подтверждён';metrics.textContent=savedOK?'Точка сохранена в браузере':'Не удалось сохранить: хранилище браузера недоступно';hint.textContent=savedOK?'Точка сохранена. При повторном открытии этого же сайта она восстановится, если браузер сохраняет данные.':'Сохранение недоступно в этом режиме браузера. Попробуй открыть сайт непосредственно в Safari.';return;}if(target)target.remove();target=new maplibregl.Marker({color:'#f97316'}).setLngLat(e.lngLat).addTo(map);hint.textContent='Цель выбрана. Нажми «Маршрут к точке». Для маршрута требуется интернет.';});
document.getElementById('route').onclick=async()=>{if(!(last||manualAnchor)||!target){hint.textContent='Сначала дождись координат и выбери цель нажатием на карту.';return;}const a=last?.c||manualAnchor,b=target.getLngLat();hint.textContent='Строим маршрут…';try{const url='https://router.project-osrm.org/route/v1/driving/'+a.longitude+','+a.latitude+';'+b.lng+','+b.lat+'?overview=full&geometries=geojson';const res=await fetch(url);if(!res.ok)throw Error('Сервис маршрутов недоступен');const data=await res.json();if(!data.routes?.length)throw Error('Маршрут не найден');route=data.routes[0].geometry;const src=map.getSource('route');if(src)src.setData({type:'Feature',geometry:route,properties:{}});const bounds=new maplibregl.LngLatBounds();route.coordinates.forEach(p=>bounds.extend(p));map.fitBounds(bounds,{padding:50});hint.textContent='Маршрут: '+(data.routes[0].distance/1000).toFixed(1)+' км. Это тестовый онлайн-маршрут, без учёта пробок.';}catch(e){hint.textContent='Ошибка: '+e.message;}};restoreManual();start();
</script></body></html>
